<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniamos – Cargar Contactos LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lime:#C4E538;--lime-dark:#A8C42A;
  --bg:#0A0A0A;--surface:#161616;--border:rgba(255,255,255,.08);
  --text:#FFFFFF;--text-2:rgba(255,255,255,.7);--text-3:rgba(255,255,255,.4);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.card{background:var(--surface);border-radius:16px;padding:36px 40px;max-width:520px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.4);text-align:center;border:1px solid var(--border)}
.logo{font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:6px}
.logo span{color:var(--lime)}
p{color:var(--text-2);font-size:.9rem;margin-bottom:24px;line-height:1.5}
.btn{display:block;width:100%;padding:14px;background:var(--lime);color:#0A0A0A;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:var(--lime-dark)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.result{margin-top:20px;padding:14px;border-radius:10px;font-size:.88rem;font-weight:700;display:none}
.result.ok{background:rgba(34,197,94,.2);color:#86EFAC;display:block}
.result.err{background:rgba(220,38,38,.2);color:#EF4444;display:block}
.stats{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(196,229,56,.15);color:var(--lime);border-radius:8px;padding:8px 16px;font-size:.82rem;font-weight:800}
.login-msg{margin-top:16px;font-size:.85rem;color:var(--text-3)}
.login-msg a{color:var(--lime);text-decoration:none;font-weight:700}
.login-msg a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔗 Un<span>IA</span>mos CRM</div>
  <p>Este archivo cargará contactos de LinkedIn en tu CRM y PRM.<br>Los contactos activos (respondieron) van al CRM. Los que aún no respondieron van al PRM.</p>
  <div id="login-required" style="display:none">
    <p class="login-msg">Debes iniciar sesión para cargar contactos.<br><a href="login.html">Iniciar sesión</a></p>
  </div>
  <div id="main-content">
    <button class="btn" id="btn-inject" onclick="injectData()">Cargar contactos ahora</button>
  </div>
  <div id="result" class="result"></div>
  <div class="stats" id="stats" style="display:none">
    <div class="stat" id="s-crm">CRM: 0</div>
    <div class="stat" id="s-prm">PRM: 0</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xhqufddfvwzdptqhohxe.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhocXVmZGRmdnd6ZHB0cWhvaHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODc0MzQsImV4cCI6MjA4OTM2MzQzNH0.GSqA2mfjppfI_Rar59bgs_sSPjLT4aYzusFi-6yI0b4';
const supabase=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

(async function(){
  try{
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){
      document.getElementById('main-content').style.display='none';
      document.getElementById('login-required').style.display='block';
      return;
    }
    currentUser=session.user;
  }catch(e){
    document.getElementById('main-content').style.display='none';
    document.getElementById('login-required').style.display='block';
  }
})();

async function injectData(){
  if(!currentUser){
    document.getElementById('result').textContent='Debes iniciar sesión primero.';
    document.getElementById('result').className='result err';
    return;
  }

  const btn=document.getElementById('btn-inject');
  btn.disabled=true;
  btn.textContent='Cargando...';

  try{
    const today=new Date().toLocaleDateString('es');

    const crmLeads=[
      {empresa:'Tallers ECI',lead:'Eusebi Roca Reguant',email:'eci@tallereseci.com',domain:'tallereseci.com',estado:'activa',prioridad:'alta',valor:'—',primerContacto:today,ultimoContacto:today,resumen:'Respondió en LinkedIn pidiendo información por email.',accion:'Enviar dossier a eci@tallereseci.com. Confirmar llamada esta semana.',activity:[{text:'Respondió en LinkedIn: pidió info a eci@tallereseci.com',type:'pos',time:'20/03/2026 21:53'}]},
      {empresa:'Almexca / Consultoría Independiente',lead:'David Martinez',email:'',estado:'activa',prioridad:'alta',valor:'—',primerContacto:'16/12/2025',ultimoContacto:today,resumen:'Consultor Estratégico. Mostró interés en colaborar.',accion:'Esperar confirmación de hora. Preparar propuesta de colaboración.',activity:[{text:'Primer contacto LinkedIn — interés en IA',type:'pos',time:'16/12/2025'}]},
      {empresa:'La Nómada de los Embudos',lead:'Carmen Miravalls',email:'',estado:'activa',prioridad:'media',valor:'—',primerContacto:'29/12/2025',ultimoContacto:today,resumen:'Diseñadora de sistemas de ventas. Preguntó si seguían pendientes de hablar.',accion:'Esperar respuesta.',activity:[{text:'Carmen preguntó si seguían pendientes de hablar',type:'pos',time:'29/12/2025'}]}
    ];

    const prmProspects=[
      {empresa:'Gruppo Berlingo',contacto:'Marc Truqué',email:'',linkedin:'linkedin.com/in/marc-truqué',cargo:'CEO',canal:'LinkedIn',sector:'Empresas / Grupo empresarial',pais:'España',prioridad:'alta',estado:'fu2',ultimoContacto:'2025-12-31',contexto:'Marta retomará el tema en Q2.',respuesta:'Respondió amablemente.',accion:'Follow-up a Marta en abril.',fuLog:[{text:'Marc: Marta os contactará cuando puedan',result:'pos',date:'31/12/2025'}]},
      {empresa:'Florida BMI Realty',contacto:'Darkis Rodriguez',email:'',linkedin:'linkedin.com/in/darkis-rodriguez',cargo:'Directora',domain:'floridabmirealty.com',canal:'LinkedIn',sector:'Real Estate',pais:'Miami, USA',prioridad:'media',estado:'contactado',ultimoContacto:'2025-12-05',contexto:'Propuesta agente IA interno. Sin respuesta.',respuesta:'',accion:'Follow-up en 2 semanas.',fuLog:[{text:'Propuesta agente IA para real estate',result:'neutral',date:'05/12/2025'}]},
      {empresa:'Skydropx Inc',contacto:'Daniel Michael Alvarado',email:'',linkedin:'linkedin.com/in/daniel-michael-alvarado',cargo:'Co-founder / CCO',domain:'skydropx.com',canal:'LinkedIn',sector:'Logística / SaaS',pais:'México',prioridad:'alta',estado:'contactado',ultimoContacto:'2025-12-05',contexto:'Propuesta IA para logística LATAM. Sin respuesta.',respuesta:'',accion:'Follow-up en 2 semanas.',fuLog:[{text:'Propuesta IA para CX y operaciones',result:'neutral',date:'05/12/2025'}]},
      {empresa:'Ex-Sears / Sanborns / Univar',contacto:'Eduardo Sterling',email:'',cargo:'CCO / Director de Operaciones',canal:'LinkedIn',sector:'Retail / Supply Chain',pais:'México',prioridad:'media',estado:'contactado',ultimoContacto:'2025-12-05',contexto:'Propuesta IA para supply chain. Sin respuesta.',respuesta:'',accion:'Follow-up esta semana.',fuLog:[{text:'Propuesta IA para supply chain',result:'neutral',date:'05/12/2025'}]},
      {empresa:'Teclim Química / Glomarchem',contacto:'Josep Oriol Turmo Rosell',email:'',cargo:'Director',canal:'LinkedIn',sector:'Química / Distribución',pais:'España',prioridad:'media',estado:'contactado',ultimoContacto:'2025-12-02',contexto:'Propuesta IA para operaciones. Sin respuesta.',respuesta:'',accion:'Follow-up en 2 semanas.',fuLog:[{text:'Propuesta IA para operaciones',result:'neutral',date:'02/12/2025'}]},
      {empresa:'Fixi',contacto:'Israel Contreras Ojeda',email:'',linkedin:'linkedin.com/in/israel-contreras',cargo:'Founder',domain:'fixi.mx',canal:'LinkedIn',sector:'Tech / Servicios',pais:'México',prioridad:'baja',estado:'fu1',ultimoContacto:'2025-12-08',contexto:'Intercambio cordial. Sin reunión concreta.',respuesta:'Positivo pero sin compromiso.',accion:'Retomar con propuesta concreta.',fuLog:[{text:'Israel: "Seguimos en contacto"',result:'pos',date:'08/12/2025'}]},
      {empresa:'Adquiere.co',contacto:'Daniel Rodriguez',email:'',cargo:'Director',domain:'adquiere.co',canal:'LinkedIn',sector:'Consultoría / IA',pais:'México',prioridad:'baja',estado:'negativo',ultimoContacto:'2025-12-06',contexto:'No interesado en servicios de IA.',respuesta:'No interesado explícitamente.',accion:'No volver a contactar.',fuLog:[{text:'Respondió: no interesado',result:'neg',date:'06/12/2025'}]}
    ];

    // Insert leads into Supabase
    const leadsToInsert=crmLeads.map(d=>({
      id:uid(),
      user_id:currentUser.id,
      data:d,
      updated_at:new Date().toISOString()
    }));

    const {error:leadsError}=await supabase.from('leads').insert(leadsToInsert);
    if(leadsError)throw leadsError;

    // Insert prospects into Supabase
    const prospectsToInsert=prmProspects.map(d=>({
      id:uid(),
      user_id:currentUser.id,
      data:d,
      updated_at:new Date().toISOString()
    }));

    const {error:prospectsError}=await supabase.from('prospects').insert(prospectsToInsert);
    if(prospectsError)throw prospectsError;

    document.getElementById('result').textContent='Datos cargados! '+leadsToInsert.length+' leads en CRM y '+prospectsToInsert.length+' prospectos en PRM. Redirigiendo...';
    document.getElementById('result').className='result ok';
    document.getElementById('stats').style.display='flex';
    document.getElementById('s-crm').textContent='CRM: '+leadsToInsert.length+' leads';
    document.getElementById('s-prm').textContent='PRM: '+prospectsToInsert.length+' prospectos';

    setTimeout(()=>{window.location.href='app.html';},2200);

  }catch(e){
    document.getElementById('result').textContent='Error: '+e.message;
    document.getElementById('result').className='result err';
    btn.disabled=false;
    btn.textContent='Cargar contactos ahora';
  }
}
</script>
</body>
</html>
