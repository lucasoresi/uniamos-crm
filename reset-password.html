<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniamos – Nueva Contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lime:#C4E538;--lime-dark:#A8C42A;
  --bg:#0A0A0A;--surface:#161616;--border:rgba(255,255,255,.08);
  --text:#FFFFFF;--text-2:rgba(255,255,255,.7);--text-3:rgba(255,255,255,.4);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.4);width:100%;max-width:420px;overflow:hidden;border:1px solid var(--border)}
.card-top{background:#0A0A0A;padding:36px 32px 28px;text-align:center}
.logo-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#C4E538;margin-right:8px}
.logo-name{color:#fff;font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
.logo-sub{color:rgba(255,255,255,.35);font-size:.8rem;margin-top:6px}
.card-body{padding:32px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.78rem;font-weight:700;color:var(--text-2);margin-bottom:6px}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;color:var(--text);background:#1A1A1A;outline:none;transition:all .15s;font-family:inherit}
.form-input:focus{border-color:#C4E538;box-shadow:0 0 0 3px rgba(196,229,56,.2)}
.btn-main{width:100%;padding:12px;background:#C4E538;color:#0A0A0A;border:none;border-radius:8px;font-size:.95rem;font-weight:800;cursor:pointer;transition:background .15s;font-family:inherit;margin-top:4px}
.btn-main:hover{background:#A8C42A}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:16px;padding:10px 14px;border-radius:8px;font-size:.82rem;font-weight:600;text-align:center;display:none}
.msg.error{background:rgba(220,38,38,.2);color:#EF4444;display:block}
.msg.success{background:rgba(34,197,94,.2);color:#86EFAC;display:block}
.back-link{display:block;text-align:center;margin-top:20px;font-size:.82rem;color:var(--text-3)}
.back-link a{color:#C4E538;text-decoration:none;font-weight:600}
.back-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div><span class="logo-dot"></span><span class="logo-name">Un<span style="color:#B8FF00">IA</span>mos</span></div>
    <div class="logo-sub">Restablecer contraseña</div>
  </div>
  <div class="card-body">
    <div class="form-group">
      <label class="form-label">Nueva contraseña</label>
      <input class="form-input" id="new-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar contraseña</label>
      <input class="form-input" id="confirm-pass" type="password" placeholder="Repite la contraseña" autocomplete="new-password">
    </div>
    <button class="btn-main" id="btn-reset" onclick="doResetPassword()">Actualizar contraseña</button>
    <div id="msg" class="msg"></div>
    <div class="back-link"><a href="login.html">Volver al login</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xhqufddfvwzdptqhohxe.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhocXVmZGRmdnd6ZHB0cWhvaHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODc0MzQsImV4cCI6MjA4OTM2MzQzNH0.GSqA2mfjppfI_Rar59bgs_sSPjLT4aYzusFi-6yI0b4';
const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text,type){
  const el=document.getElementById('msg');
  el.textContent=text;
  el.className='msg '+type;
}

async function doResetPassword(){
  const pass=document.getElementById('new-pass').value;
  const confirm=document.getElementById('confirm-pass').value;

  if(!pass||!confirm){
    showMsg('Completa ambos campos.','error');
    return;
  }
  if(pass.length<6){
    showMsg('La contraseña debe tener mínimo 6 caracteres.','error');
    return;
  }
  if(pass!==confirm){
    showMsg('Las contraseñas no coinciden.','error');
    return;
  }

  const btn=document.getElementById('btn-reset');
  btn.disabled=true;
  btn.textContent='Actualizando...';

  try{
    const {error}=await sb.auth.updateUser({password:pass});
    if(error){
      showMsg(error.message||'Error al actualizar la contraseña.','error');
      btn.disabled=false;
      btn.textContent='Actualizar contraseña';
      return;
    }
    showMsg('Contraseña actualizada. Redirigiendo al CRM...','success');
    setTimeout(()=>{window.location.href='app.html';},2000);
  }catch(e){
    showMsg('Error al procesar la solicitud.','error');
    btn.disabled=false;
    btn.textContent='Actualizar contraseña';
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter')doResetPassword();
});
</script>
</body>
</html>
