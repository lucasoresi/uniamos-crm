<!DOCTYPE html>
<html lang="es" data-theme="onyx" data-accent="lime">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniamos · Nueva contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(0.16 0.006 80);
  --surface:oklch(0.21 0.006 80);
  --border:oklch(0.32 0.008 80 / 0.55);
  --text:oklch(0.98 0.005 80);
  --text-2:oklch(0.78 0.005 80);
  --text-3:oklch(0.58 0.005 80);
  --accent:oklch(0.86 0.18 122);
  --accent-2:oklch(0.72 0.18 122);
  --accent-ink:oklch(0.20 0.04 122);
  --accent-soft:oklch(0.86 0.18 122 / 0.14);
  --ff:'Inter Tight','Inter',system-ui,sans-serif;
}
body{font-family:var(--ff);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;letter-spacing:-0.01em}
.card{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px -10px rgb(0 0 0 / 0.6);width:100%;max-width:420px;overflow:hidden;border:1px solid var(--border)}
.card-top{background:var(--bg);padding:32px 32px 24px;text-align:center;border-bottom:1px solid var(--border)}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-size:1.4rem;font-weight:800;letter-spacing:-0.025em}
.logo em{font-style:normal;color:var(--accent)}
.logo svg{color:var(--accent)}
.logo-sub{color:var(--text-3);font-size:.78rem;margin-top:8px;letter-spacing:0.02em}
.card-body{padding:28px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.74rem;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.01em}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;color:var(--text);background:var(--bg);outline:none;transition:all .15s;font-family:inherit}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-main{width:100%;padding:11px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px}
.btn-main:hover{background:var(--accent-2)}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:.8rem;font-weight:500;text-align:center;display:none}
.msg.error{background:oklch(0.70 0.20 25 / 0.18);color:oklch(0.86 0.10 25);border:1px solid oklch(0.70 0.20 25 / 0.35);display:block}
.msg.success{background:oklch(0.78 0.16 145 / 0.18);color:oklch(0.88 0.10 145);border:1px solid oklch(0.78 0.16 145 / 0.35);display:block}
.back-link{display:block;text-align:center;margin-top:18px;font-size:.78rem;color:var(--text-3)}
.back-link a{color:var(--accent);text-decoration:none;font-weight:600}
.back-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M5 7v6a7 7 0 1 0 14 0V7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="6" r="1.8" fill="currentColor"/>
      </svg>
      <span>Un<em>IA</em>mos</span>
    </div>
    <div class="logo-sub">Restablecer contraseña</div>
  </div>
  <div class="card-body">
    <div class="form-group">
      <label class="form-label">Nueva contraseña</label>
      <input class="form-input" id="new-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar contraseña</label>
      <input class="form-input" id="confirm-pass" type="password" placeholder="········" autocomplete="new-password">
    </div>
    <button class="btn-main" id="btn-reset" onclick="doReset()">Cambiar contraseña</button>
    <div id="reset-msg" class="msg"></div>
    <div class="back-link"><a href="/login.html">← Volver al login</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://llleoqfeluptmmbqluab.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsbGVvcWZlbHVwdG1tYnFsdWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTAzODMsImV4cCI6MjA5MTkyNjM4M30.DQ_iD6xcb0kxr3ZyOl2c_eRhpR9RIcRmBi7tYVjNf5U';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, type) {
  const el = document.getElementById('reset-msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function doReset() {
  const p1 = document.getElementById('new-pass').value;
  const p2 = document.getElementById('confirm-pass').value;
  if (!p1 || p1.length < 6) return showMsg('La contraseña debe tener mínimo 6 caracteres.', 'error');
  if (p1 !== p2) return showMsg('Las contraseñas no coinciden.', 'error');

  const btn = document.getElementById('btn-reset');
  btn.disabled = true;
  btn.textContent = 'Cargando...';

  try {
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      showMsg(error.message || 'Error al cambiar la contraseña.', 'error');
      btn.disabled = false;
      btn.textContent = 'Cambiar contraseña';
      return;
    }
    showMsg('¡Contraseña actualizada! Redirigiendo al login…', 'success');
    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
  } catch (e) {
    showMsg('Error al cambiar la contraseña.', 'error');
    btn.disabled = false;
    btn.textContent = 'Cambiar contraseña';
  }
}
</script>
</body>
</html>
