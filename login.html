<!DOCTYPE html>
<html lang="es" data-theme="onyx" data-accent="lime">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniamos · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(0.16 0.006 80);
  --surface:oklch(0.21 0.006 80);
  --surface-2:oklch(0.25 0.006 80);
  --border:oklch(0.32 0.008 80 / 0.55);
  --text:oklch(0.98 0.005 80);
  --text-2:oklch(0.78 0.005 80);
  --text-3:oklch(0.58 0.005 80);
  --accent:oklch(0.86 0.18 122);
  --accent-2:oklch(0.72 0.18 122);
  --accent-ink:oklch(0.20 0.04 122);
  --accent-soft:oklch(0.86 0.18 122 / 0.14);
  --p-urg:oklch(0.70 0.20 25);
  --ok:oklch(0.78 0.16 145);
  --ff:'Inter Tight','Inter',system-ui,sans-serif;
}
body{font-family:var(--ff);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;letter-spacing:-0.01em}
.card{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px -10px rgb(0 0 0 / 0.6);width:100%;max-width:420px;overflow:hidden;border:1px solid var(--border)}
.card-top{background:var(--bg);padding:32px 32px 24px;text-align:center;border-bottom:1px solid var(--border)}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-size:1.4rem;font-weight:800;letter-spacing:-0.025em}
.logo em{font-style:normal;color:var(--accent)}
.logo svg{color:var(--accent)}
.logo-sub{color:var(--text-3);font-size:.78rem;margin-top:8px;letter-spacing:0.02em}
.card-body{padding:28px}
.cloud-badge{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:.74rem;font-weight:600;text-align:center;margin-bottom:20px;border:1px solid oklch(0.86 0.18 122 / 0.32)}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1.5px solid var(--border)}
.tab{flex:1;text-align:center;padding:10px;font-size:.85rem;font-weight:600;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all .15s;font-family:inherit;letter-spacing:-0.01em}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.74rem;font-weight:600;color:var(--text-2);margin-bottom:6px;letter-spacing:0.01em;text-transform:uppercase}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;color:var(--text);background:var(--bg);outline:none;transition:all .15s;font-family:inherit}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-main{width:100%;padding:11px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-size:.92rem;font-weight:700;cursor:pointer;transition:background .15s;font-family:inherit;margin-top:6px;letter-spacing:-0.01em}
.btn-main:hover{background:var(--accent-2);color:var(--accent-ink)}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.btn-google{width:100%;padding:11px;background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius:8px;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.01em}
.btn-google:hover{background:var(--surface-2);border-color:var(--accent)}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:.8rem;font-weight:500;text-align:center;display:none}
.msg.error{background:oklch(0.70 0.20 25 / 0.18);color:oklch(0.86 0.10 25);border:1px solid oklch(0.70 0.20 25 / 0.35);display:block}
.msg.success{background:oklch(0.78 0.16 145 / 0.18);color:oklch(0.88 0.10 145);border:1px solid oklch(0.78 0.16 145 / 0.35);display:block}
.footer-note{margin-top:20px;text-align:center;font-size:.72rem;color:var(--text-3);line-height:1.5}
.forgot-pass{text-align:center;margin-top:14px}
.forgot-pass a{font-size:.78rem;color:var(--accent);text-decoration:none;cursor:pointer;font-weight:600}
.forgot-pass a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M5 7v6a7 7 0 1 0 14 0V7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="6" r="1.8" fill="currentColor"/>
      </svg>
      <span>Un<em>IA</em>mos</span>
    </div>
    <div class="logo-sub">Sales Hub · CRM + PRM</div>
  </div>
  <div class="card-body">
    <div class="cloud-badge">☁️ Cloud · Tus datos se sincronizan en la nube</div>
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Crear cuenta</div>
    </div>

    <div id="panel-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="login-email" type="email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" id="login-pass" type="password" placeholder="········" autocomplete="current-password">
      </div>
      <button class="btn-main" id="btn-login" onclick="doLogin()">Entrar al CRM</button>
      <button class="btn-google" id="btn-google-login" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </button>
      <div id="login-msg" class="msg"></div>
      <div class="forgot-pass"><a onclick="doForgotPassword()">¿Olvidaste tu contraseña?</a></div>
    </div>

    <div id="panel-register" style="display:none">
      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input class="form-input" id="reg-name" type="text" placeholder="Nombre Apellido" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="reg-email" type="email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <button class="btn-main" id="btn-register" onclick="doRegister()">Crear cuenta</button>
      <button class="btn-google" id="btn-google-register" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </button>
      <div id="register-msg" class="msg"></div>
    </div>

    <div class="footer-note">Acceso seguro con autenticación en la nube.<br>Tus datos están protegidos y sincronizados.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://llleoqfeluptmmbqluab.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsbGVvcWZlbHVwdG1tYnFsdWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTAzODMsImV4cCI6MjA5MTkyNjM4M30.DQ_iD6xcb0kxr3ZyOl2c_eRhpR9RIcRmBi7tYVjNf5U';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.replace('/app.html');
  } catch (e) {
    console.error('Session check error:', e);
  }
})();

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('panel-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('panel-register').style.display = tab === 'register' ? '' : 'none';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

function setButtonLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  const labels = { 'btn-login': 'Entrar al CRM', 'btn-register': 'Crear cuenta' };
  btn.textContent = loading ? 'Cargando...' : labels[btnId];
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return showMsg('login-msg', 'Completa todos los campos.', 'error');
  setButtonLoading('btn-login', true);
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) {
      showMsg('login-msg', error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : error.message, 'error');
      setButtonLoading('btn-login', false);
      return;
    }
    if (data.session) window.location.href = '/app.html';
  } catch (e) {
    showMsg('login-msg', 'Error al iniciar sesión. Intenta de nuevo.', 'error');
    setButtonLoading('btn-login', false);
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) return showMsg('register-msg', 'Completa todos los campos.', 'error');
  if (pass.length < 6) return showMsg('register-msg', 'La contraseña debe tener mínimo 6 caracteres.', 'error');
  setButtonLoading('btn-register', true);
  try {
    const { data, error } = await sb.auth.signUp({
      email,
      password: pass,
      options: { data: { full_name: name } }
    });
    if (error) {
      showMsg('register-msg', error.message || 'Error al crear la cuenta.', 'error');
      setButtonLoading('btn-register', false);
      return;
    }
    showMsg('register-msg', '¡Cuenta creada! Revisa tu email para confirmar. Luego inicia sesión.', 'success');
    setTimeout(() => {
      switchTab('login');
      document.getElementById('login-email').value = email;
      setButtonLoading('btn-register', false);
    }, 2000);
  } catch (e) {
    showMsg('register-msg', 'Error al crear la cuenta. Intenta de nuevo.', 'error');
    setButtonLoading('btn-register', false);
  }
}

async function doGoogleLogin() {
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/app.html',
        scopes: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/calendar.readonly',
        queryParams: { access_type: 'offline', prompt: 'consent' }
      }
    });
    if (error) {
      const msgId = document.getElementById('panel-login').style.display !== 'none' ? 'login-msg' : 'register-msg';
      showMsg(msgId, 'Error al conectar con Google. Intenta de nuevo.', 'error');
    }
  } catch (e) {
    const msgId = document.getElementById('panel-login').style.display !== 'none' ? 'login-msg' : 'register-msg';
    showMsg(msgId, 'Error al conectar con Google. Intenta de nuevo.', 'error');
  }
}

async function doForgotPassword() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  if (!email) return showMsg('login-msg', 'Ingresa tu email primero.', 'error');
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
    if (error) return showMsg('login-msg', 'Error al enviar email de recuperación.', 'error');
    showMsg('login-msg', 'Se envió un email de recuperación. Revisa tu bandeja.', 'success');
  } catch (e) {
    showMsg('login-msg', 'Error al procesar la solicitud.', 'error');
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginPanel = document.getElementById('panel-login');
  if (loginPanel.style.display !== 'none') doLogin();
  else doRegister();
});
</script>
</body>
</html>
